name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Configure git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: go vet ./...
      - run: go test ./...
      - name: Cross-compile
        shell: bash
        run: |
          GOOS=linux   GOARCH=amd64 go build -o /dev/null ./cmd/pushall
          GOOS=darwin  GOARCH=arm64 go build -o /dev/null ./cmd/pushall
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/pushall
